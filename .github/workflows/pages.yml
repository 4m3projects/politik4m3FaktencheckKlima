name: Klima-Faktencheck Webseite
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie: der Verlauf (scripts/verlauf.js, docs/VERLAUF.md) wird aus der Git-Historie berechnet.
          fetch-depth: 0
      - name: JavaScript Syntax prüfen
        run: |
          for f in site/*.js; do node --check "$f"; done
      - name: Gemeinsamer Faktenindex identisch mit dem Hauptprojekt
        # docs/FAKTENINDEX.md, Abschnitt 1: Regel, Anzeige, Tests und Doku sind in allen drei Faktencheck-Repositories
        # bytegleich; maßgeblich ist politik4m3Facktencheck (main). Abweichung: Fehler im Pull Request, Warnung auf main.
        run: |
          set -uo pipefail
          base=https://raw.githubusercontent.com/4m3projects/politik4m3Facktencheck/main
          level=warning; [[ "${{ github.event_name }}" == "pull_request" ]] && level=error
          bad=0
          # Seit 20.11.2026 auch Themen-Wissensdatenbank und Verlauf: Sie fehlten hier beim Aufbau der Seite unbemerkt.
          for f in site/faktenindex.js site/faktenindex-ui.js site/faktenindex-test.js scripts/faktenindex.js docs/FAKTENINDEX.md \
                   site/wissen.js site/wissen-test.js site/themen.js scripts/wissen.js site/verlauf-test.js scripts/verlauf.js docs/VERLAUF.md; do
            if ! curl -fsSL --retry 3 "$base/$f" -o "$RUNNER_TEMP/ref"; then echo "::warning file=$f::$f im Hauptprojekt nicht abrufbar, Vergleich übersprungen"; continue; fi
            if ! cmp -s "$RUNNER_TEMP/ref" "$f"; then echo "::$level file=$f::$f weicht vom Hauptprojekt ab; Änderungen dort vornehmen und unverändert übernehmen."; bad=1; fi
          done
          [[ $bad == 0 || $level == warning ]]

      - name: Faktenindex und Ampel prüfen (gemeinsame Regel aller Faktencheckseiten)
        run: |
          node --test site/faktenindex-test.js
          node scripts/faktenindex.js pruefen
      - name: Faktencheck-Daten prüfen
        run: node scripts/build-index.js --check
      - name: Verlauf prüfen (aus der Git-Historie berechnet)
        run: node --test site/verlauf-test.js
      - name: Themen-Wissensdatenbank prüfen (jedes Video braucht themen.json, AGENTS.md „Themen bei jedem Video prüfen“)
        run: |
          set -euo pipefail
          node --test site/wissen-test.js
          missing=0
          for d in faktenchecks/*/; do
            id=$(basename "$d")
            if [[ -f "$d/strukturiert/aussagen.json" && ! -f "$d/themen.json" ]]; then
              echo "::error file=faktenchecks/$id::Video $id hat keine themen.json. Themen zuordnen (docs/AGENTEN_WISSEN.md, Abschnitt 3)."
              missing=1
            fi
          done
          [[ $missing == 0 ]]
          node scripts/wissen.js pruefen
          node scripts/wissen.js korrekturen --bericht "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            node scripts/wissen.js aenderung --basis FETCH_HEAD
          fi
      - name: Index mit Commit erzeugen
        run: node scripts/build-index.js
      - name: Website bauen
        run: |
          mkdir -p _site
          cp site/*.html site/*.css site/favicon.svg site/favicon.ico site/apple-touch-icon.png _site/
          # Seitenskripte ohne Testdateien (*-test.js)
          for f in site/*.js; do case "$f" in *-test.js) ;; *) cp "$f" _site/ ;; esac; done
          mkdir -p _site/daten
          cp daten/*.json _site/daten/
          # Themenseiten (site/themen.js) und Verlaufsseite lesen diese beiden Dateien; sie werden nie von Hand gepflegt.
          node scripts/wissen.js export _site/daten/wissen.json
          node scripts/verlauf.js export _site/daten/verlauf.json
          if [ -d faktenchecks ]; then
            for d in faktenchecks/*; do
              [ -d "$d" ] || continue
              id=$(basename "$d")
              mkdir -p "_site/daten/$id"
              find "$d" -type f \( -name '*.json' -o -name '*.md' \) | while read -r f; do
                rel="${f#"$d"/}"
                mkdir -p "_site/daten/$id/$(dirname "$rel")"
                cp "$f" "_site/daten/$id/$rel"
              done
            done
          fi
      - name: Alle Datendateien der Webseite vorhanden
        # Die Webseite blendet fehlende Daten still aus (keine Themen, „Noch kein Verlauf“). Deshalb hier hart prüfen,
        # dass jede Datei existiert und nicht leer ist, die app.js und themen.js laden.
        run: |
          set -euo pipefail
          for f in index.json beziehungen.json wissen.json verlauf.json; do
            [[ -s "_site/daten/$f" ]] || { echo "::error::_site/daten/$f fehlt"; exit 1; }
          done
          node -e '
            const fs = require("fs"); const fc = fs.readdirSync("faktenchecks").filter(d => fs.existsSync(`faktenchecks/${d}/strukturiert/aussagen.json`));
            const w = JSON.parse(fs.readFileSync("_site/daten/wissen.json")); const v = JSON.parse(fs.readFileSync("_site/daten/verlauf.json"));
            const wv = new Set((w.videos || []).map(x => x.id)); const vv = new Set((v.videos || []).map(x => x.id));
            const bad = fc.filter(id => !wv.has(id) || !vv.has(id));
            if (bad.length) { console.log("::error::Ohne Themen oder Verlauf: " + bad.join(", ")); process.exit(1); }
            console.log(`OK: ${fc.length} Videos mit Themen und Verlauf.`);'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: site-preview
          path: _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
